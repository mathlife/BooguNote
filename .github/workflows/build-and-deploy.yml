name: Build All-Platform Standalone Apps (Win / Mac / Linux / Android / iOS)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 构建 Windows / macOS / Linux 独立桌面可执行程序 (.exe / .dmg / .AppImage)
  build-desktop:
    name: 构建桌面独立客户端 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
          - os: macos-latest
            cmd: npm run dist:mac
          - os: ubuntu-latest
            cmd: npm run dist:linux

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 打包独立桌面客户端
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.cmd }}

      - name: 上传桌面端独立安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
          if-no-files-found: ignore

  # 2. 构建 Android 独立可安装 APK (BooguNote-Android.apk)
  build-android:
    name: 构建 Android 独立安装包 (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装前端与 Capacitor 依赖
        run: npm install --no-audit --no-fund

      - name: 编译前端资源并生成 Android 工程
        run: |
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 使用 Runner 内置 Android SDK 编译独立 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../BooguNote-Android.apk

      - name: 上传 Android APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: BooguNote-Android.apk

  # 3. 构建 iOS 独立可安装 IPA (BooguNote-iOS.ipa)
  build-ios:
    name: 构建 iOS 独立安装包 (.ipa)
    runs-on: macos-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装前端与 Capacitor iOS 依赖
        run: npm install --no-audit --no-fund

      - name: 编译前端资源并生成 iOS Xcode 工程
        run: |
          npm run build
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: 使用 Xcode 编译 iOS 真机 App 并打包为 .ipa
        working-directory: ios/App
        run: |
          if [ -f "Podfile" ] && [ ! -d "App.xcworkspace" ]; then
            pod install
          fi
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              clean build
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              clean build
          fi
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../BooguNote-iOS.ipa Payload

      - name: 上传 iOS IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: BooguNote-iOS.ipa

  # 4. 自动汇总全平台独立安装包并发布到 GitHub Releases
  publish-release:
    name: 发布全平台独立安装包至 GitHub Release
    needs: [build-desktop, build-android, build-ios]
    if: always() && (needs.build-desktop.result == 'success' || needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 自动创建/更新 GitHub Release (v1.1.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "BooguNote Next v1.1.0 - 全平台独立可运行版 (Win / Mac / Linux / Android / iOS)"
          body: |
            ### 全平台独立可运行安装包下载
            - **Windows 独立免安装单文件版**：`BooguNote-Windows-Standalone.exe` (轻量秒开) / `BooguNote-Windows-Portable-x64.exe` (完整 Electron 内核)
            - **Windows 标准安装版**：`BooguNote-Windows-Setup-x64.exe`
            - **macOS 独立桌面版**：`BooguNote-macOS-*.dmg`
            - **Linux 独立可执行版**：`BooguNote-Linux-x86_64.AppImage`
            - **Android 手机独立安装包**：`BooguNote-Android.apk`
            - **iOS (iPhone / iPad) 独立安装包**：`BooguNote-iOS.ipa` (支持 AltStore / Sideloadly / TrollStore / 爱思助手签名安装)
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.apk
            artifacts/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
