name: Build & Deploy BooguNote Next

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    name: 构建 Web / PWA 生产包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 编译构建生产包
        run: npm run build

      - name: 上传构建产物 (dist)
        uses: actions/upload-artifact@v4
        with:
          name: boogunote-web-pwa-dist
          path: dist/
