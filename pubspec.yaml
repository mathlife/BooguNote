name: boogunote_native
description: "BooguNote Native Outliner - A Pure Native, Cross-Platform Tree Outliner & Block Note Application (Zero Web / Zero Chrome)"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  window_manager: ^0.3.9
  screen_retriever: ^0.1.9
  hotkey_manager: ^0.2.3
  file_picker: ^8.0.0
  xml: ^6.5.0
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - public/icon.png
